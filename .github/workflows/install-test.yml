name: install-test

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, catches broken URLs/updates

permissions:
  contents: read

jobs:
  brew:
    name: brew install (macos-15)
    runs-on: macos-15
    steps:
      - name: Install and test via Homebrew
        run: |
          set -euo pipefail
          brew install geyutu6755/tap/shipsmoke
          shipsmoke version
          test -x "$(which shipsmoke)"

  # Homebrew does not support Linux on GitHub's ubuntu runners without a
  # manual Linuxbrew install; instead this job verifies the exact linux
  # assets the formula references, including their checksums.txt entry.
  linux-assets:
    name: formula linux assets (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Download, checksum-verify and run the linux/amd64 asset
        run: |
          set -euo pipefail
          curl -fsSL -o shipsmoke.tar.gz             https://github.com/geyutu6755/shipsmoke/releases/download/v1.0.2/shipsmoke_linux_amd64.tar.gz
          curl -fsSL -o checksums.txt             https://github.com/geyutu6755/shipsmoke/releases/download/v1.0.2/checksums.txt
          grep "shipsmoke_linux_amd64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf shipsmoke.tar.gz
          ./shipsmoke version

  scoop:
    name: scoop install (windows-2025)
    runs-on: windows-2025
    steps:
      - name: Ensure Scoop (windows runners do not preinstall it)
        shell: powershell
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            irm get.scoop.sh -outfile install-scoop.ps1
            .\install-scoop.ps1 -RunAsAdmin
            echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Install and test via Scoop
        shell: powershell
        run: |
          scoop bucket add geyutu6755 https://github.com/geyutu6755/scoop-bucket
          scoop install shipsmoke
          shipsmoke version
