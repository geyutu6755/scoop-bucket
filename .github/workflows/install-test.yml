name: install-test

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # weekly, catches broken URLs/updates

permissions:
  contents: read

jobs:
  brew:
    name: brew install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15 }
          - { os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ensure Homebrew (ubuntu runners do not preinstall it)
        if: runner.os == 'Linux'
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew || {
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          }
      - name: Install and test via Homebrew
        run: |
          set -euo pipefail
          brew install geyutu6755/tap/shipsmoke
          shipsmoke version
          test -x "$(which shipsmoke)"

  scoop:
    name: scoop install
    runs-on: windows-2025
    steps:
      - name: Ensure Scoop (windows runners do not preinstall it)
        shell: powershell
        run: |
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            irm get.scoop.sh -outfile install-scoop.ps1
            .\install-scoop.ps1 -RunAsAdmin
            echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Install and test via Scoop
        shell: powershell
        run: |
          scoop bucket add geyutu6755 https://github.com/geyutu6755/scoop-bucket
          scoop install shipsmoke
          shipsmoke version
